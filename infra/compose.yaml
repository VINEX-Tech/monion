# Local development stack. Every port binds to 127.0.0.1 only.
# Override host ports with POSTGRES_PORT etc. when the defaults are taken.
name: monion
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-monion}
      POSTGRES_USER: ${POSTGRES_USER:-monion}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
    ports: ["127.0.0.1:${POSTGRES_PORT:-5432}:5432"]
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"], interval: 5s, timeout: 3s, retries: 10 }
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-monion-local}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-local-development-only}
    ports: ["127.0.0.1:${MINIO_PORT:-9000}:9000", "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"]
    volumes: [minio-data:/data]
  mailpit:
    image: axllent/mailpit:v1.27
    ports: ["127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025", "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"]
  mock-university:
    build: ./mock-university
    ports: ["127.0.0.1:${MOCK_UNIVERSITY_PORT:-3100}:3100"]
  mock-push:
    image: wiremock/wiremock:3.13.1
    ports: ["127.0.0.1:${MOCK_PUSH_PORT:-3200}:8080"]
volumes:
  postgres-data:
  minio-data:
