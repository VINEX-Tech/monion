# Example reverse proxy configuration. Not deployed anywhere.
# TLS certificate directives are left to the deployment.
server {
  listen 443 ssl http2;
  server_name monion.example.edu;
  root /srv/monion/dashboard;
  try_files $uri /index.html;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
}
server {
  listen 443 ssl http2;
  server_name api.monion.example.edu;
  client_max_body_size 8m;
  location / { proxy_pass http://api:3000; proxy_set_header X-Forwarded-Proto https; proxy_set_header X-Request-ID $request_id; }
}
