name: release-artifacts

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  web-and-api:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: dashboard
          path: apps/dashboard/dist
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: api
          path: |
            apps/api/dist
            apps/api/prisma
          if-no-files-found: error

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.4
          cache: true
      - working-directory: apps/mobile
        run: flutter pub get && flutter analyze && flutter test && flutter build apk --release
      # Prototype build: signed with the Android debug key, for test phones only.
      - uses: actions/upload-artifact@v4
        with:
          name: monion-android-prototype-debug-signed
          path: apps/mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
